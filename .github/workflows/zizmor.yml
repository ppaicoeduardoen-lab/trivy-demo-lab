name: Zizmor - GitHub Actions Security Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions: {}

jobs:
  zizmor:
    name: Scan Workflows with Zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa
        with:
          advanced-security: false
          inputs: .github/workflows
          persona: auditor
          min-severity: medium
          min-confidence: medium
          online-audits: false
          annotations: true
