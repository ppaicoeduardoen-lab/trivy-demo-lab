name: Supply Chain Guard

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
      - "Dockerfile*"
      - ".goreleaser.yml"
      - "goreleaser-canary.yml"

  pull_request:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
      - "Dockerfile*"
      - ".goreleaser.yml"
      - "goreleaser-canary.yml"

  workflow_dispatch:

  workflow_run:
    workflows: ["Build with Fake Dependency"]
    types:
      - requested
      - in_progress

permissions:
  contents: read
  actions: write

jobs:
  auto-block-malicious-workflow:
    name: Auto block malicious workflow execution
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest

    steps:
      - name: Detect suspicious workflow execution
        run: |
          echo "[SUPPLY CHAIN GUARD] Ejecución sospechosa detectada."
          echo "Workflow detectado: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Actor: ${{ github.event.workflow_run.actor.login }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo ""
          echo "[RESULTADO] BLOQUEADO: se intentará cancelar el workflow asociado al ataque."

      - name: Cancel malicious workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "[SUPPLY CHAIN GUARD] Enviando orden de cancelación..."

          HTTP_CODE=$(curl -s -o /tmp/cancel_response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel")

          echo "HTTP_CODE=$HTTP_CODE"

          if [ "$HTTP_CODE" = "202" ]; then
            echo "[SUPPLY CHAIN GUARD] Cancelación enviada correctamente."
            echo "[RESULTADO] BLOQUEADO: el workflow malicioso fue cancelado por el control defensivo."
            exit 1
          fi

          echo "[SUPPLY CHAIN GUARD] No se pudo cancelar o el workflow ya terminó."
          echo "Respuesta de GitHub:"
          cat /tmp/cancel_response.txt || true
          echo "[RESULTADO] BLOQUEO INTENTADO: revisar si el workflow malicioso terminó demasiado rápido."
          exit 1

  guard:
    name: Block Zombification Patterns
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Detect supply chain zombification patterns
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          findings = []
          root = Path(".")

          ALLOWED_WORKFLOWS = {
              "supply-chain.yml",
              "supply-chain-guard.yml",
              "zizmor.yml",
              "build-secure.yml",
          }

          def add(path, line_number, reason, line):
              findings.append({
                  "file": str(path),
                  "line": line_number,
                  "reason": reason,
                  "line_content": line.strip()
              })

          def scan_file(path, checks):
              if not path.exists():
                  return

              text = path.read_text(encoding="utf-8", errors="ignore")

              for index, line in enumerate(text.splitlines(), start=1):
                  for pattern, reason in checks:
                      if re.search(pattern, line, re.IGNORECASE):
                          add(path, index, reason, line)

          go_mod_checks = [
              (r"^\s*replace\s+.+=>\s*https?://", "Bloqueado: go.mod no debe usar replace hacia HTTP/HTTPS."),
              (r"trivy-db-fake", "Bloqueado: dependencia falsa usada en el ataque detectada."),
              (r"_labdeps", "Bloqueado: dependencia local temporal detectada."),
              (r"GONOSUMDB", "Bloqueado: desactivación de verificación GONOSUMDB detectada."),
              (r"GOINSECURE", "Bloqueado: uso de GOINSECURE detectado."),
          ]

          workflow_checks = [
              (r"pull_request_target", "Bloqueado: pull_request_target puede ejecutar código no confiable con privilegios."),
              (r"runs-on:\s*self-hosted", "Bloqueado: self-hosted runner detectado en workflow sensible."),
              (r"trivy-db-fake", "Bloqueado: dependencia falsa usada para zombificación detectada."),
              (r"dependency-proof", "Bloqueado: archivo usado para activar payload detectado."),
              (r"_labdeps", "Bloqueado: ruta temporal de dependencia falsa detectada."),
              (r"192\.168\.56\.101", "Bloqueado: conexión hacia Kali/fake registry detectada."),
              (r"http://", "Bloqueado: descarga HTTP no cifrada detectada."),
              (r"Invoke-WebRequest", "Revisar: descarga remota desde PowerShell detectada."),
              (r"\bcurl\b", "Revisar: descarga remota con curl detectada."),
              (r"\bwget\b", "Revisar: descarga remota con wget detectada."),
              (r"go\s+mod\s+edit\s+-replace", "Bloqueado: modificación dinámica de replace en go.mod detectada."),
              (r"go\s+env\s+-w\s+GONOSUMDB", "Bloqueado: desactivación de verificación de módulos detectada."),
              (r"go\s+env\s+-w\s+GOINSECURE", "Bloqueado: uso de GOINSECURE detectado."),
              (r"secrets\.AWS_", "Bloqueado: secreto AWS usado directamente en workflow."),
              (r"secrets\.DOCKER_", "Bloqueado: secreto Docker usado directamente en workflow."),
              (r"secrets\.GITHUB_TOKEN", "Bloqueado: uso explícito riesgoso de GITHUB_TOKEN."),
              (r":latest", "Revisar: tag latest mutable detectado. Usar digest SHA256 o tag inmutable."),
          ]

          docker_checks = [
              (r":latest", "Revisar: tag latest mutable detectado."),
              (r"curl\s+http://", "Bloqueado: descarga HTTP con curl detectada."),
              (r"wget\s+http://", "Bloqueado: descarga HTTP con wget detectada."),
          ]

          scan_file(root / "go.mod", go_mod_checks)
          scan_file(root / "go.sum", [(r"trivy-db-fake", "Bloqueado: dependencia falsa presente en go.sum.")])

          workflows_dir = root / ".github" / "workflows"

          if workflows_dir.exists():
              for workflow in workflows_dir.glob("*"):
                  if workflow.suffix.lower() not in [".yml", ".yaml"]:
                      continue

                  if workflow.name in ALLOWED_WORKFLOWS:
                      continue

                  scan_file(workflow, workflow_checks)

                  if workflow.name.lower() == "dependency-attack.yml":
                      add(workflow, 1, "Bloqueado: workflow de ataque activo en el repositorio.", workflow.name)

                  if workflow.name.lower() == "build-vulnerable.yml":
                      add(workflow, 1, "Bloqueado: workflow vulnerable activo en el repositorio.", workflow.name)

          for candidate in [
              root / "Dockerfile",
              root / "Dockerfile.canary",
              root / ".goreleaser.yml",
              root / "goreleaser-canary.yml",
          ]:
              scan_file(candidate, docker_checks)

          if findings:
              print("")
              print("[SUPPLY CHAIN GUARD] Riesgos detectados:")
              print("")

              for finding in findings:
                  print(f"- {finding['file']}:{finding['line']}")
                  print(f"  Motivo: {finding['reason']}")
                  print(f"  Línea: {finding['line_content']}")
                  print("")

              print("[RESULTADO] BLOQUEADO: se detectaron patrones compatibles con zombificación, dependency confusion o CI/CD inseguro.")
              sys.exit(1)

          print("[SUPPLY CHAIN GUARD] OK: no se detectaron patrones de zombificación.")
